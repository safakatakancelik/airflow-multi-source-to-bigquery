# One entry per source. The DAG builds an identical task group for each:
#   extract -> transform -> load_staging -> quality_check -> publish
#
# This file is safe to publish: it holds structure only. Every environment-specific value (project
# ids, hosts, bucket names, table names) is a ${VAR} / ${VAR:-default} read from the environment
# (.env, git-ignored) when a task runs. tests/test_no_secrets.py enforces this.
# Connection ids refer to Airflow Connections (see .env.example), never to inline secrets.
#
# `key` lists the column(s) that must be non-NULL and unique. In `transform`, drop / rename / cast
# use snake_case column names (every column is snake_cased first).

destination:
  gcp_conn_id: google_cloud_default
  project: ${GCP_PROJECT_ID}
  dataset: ${BQ_DATASET:-ingest_demo}
  location: ${BQ_LOCATION:-US}
  staging_expiration_days: 7

sources:
  # 1. Public REST API (no auth, follows the `next` link across pages) ----------------------
  - name: pokeapi_pokemon
    type: rest_api
    base_url: https://pokeapi.co   # public API, no secret; use conn_id instead for APIs needing auth
    endpoint: /api/v2/pokemon
    params: {limit: 50}
    records_path: results
    next_path: next
    max_pages: 3
    key: [name]

  # 2. Supabase (Postgres, relational join of songs -> artists / genres) ------------------
  - name: supabase_songs
    type: postgres
    conn_id: supabase_default
    query: |
      SELECT s.id AS song_id, s.title, s.duration_seconds, s.release_year, s.explicit,
             a.name AS artist_name, a.country AS artist_country, g.name AS genre
      FROM songs s
      JOIN artists a ON a.id = s.artist_id
      JOIN genres g ON g.id = s.genre_id
    key: [song_id]

  # 3. MongoDB Atlas (nested playlist documents) --------------------------------------------
  - name: mongo_playlists
    type: mongo
    conn_id: mongo_default
    database: ${MONGO_DATABASE:-ingest_demo}
    collection: ${MONGO_COLLECTION:-playlists}
    key: [id]
    transform:
      cast: {created_year: int}

  # 4. Amazon S3 (object storage; a Parquet object in your own bucket) ---------------------
  - name: s3_song_streams
    type: s3_file
    conn_id: aws_default
    bucket: ${S3_BUCKET}
    object_key: ${S3_OBJECT_KEY:-ingest-demo/song_streams.parquet}
    format: parquet
    key: [stream_id]
    transform:
      cast: {chart_date: date}

  # 5. Public CSV over HTTPS (S&P 500 constituents, public domain) -----------------------
  - name: https_sp500_companies
    type: http_file
    url: ${HTTPS_CSV_URL:-https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv}
    format: csv
    key: [symbol]
    transform:
      cast: {date_added: date, cik: int}
