<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Data flow: sources to Airflow (extract, transform) to BigQuery (load_staging, quality_check, publish)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="1200" height="620" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="30" y="40" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">SOURCES</text>
<text x="475" y="40" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">APACHE AIRFLOW</text>
<text x="880" y="40" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">BIGQUERY</text>
<rect x="30" y="58" width="340" height="94" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="46" y="88" font-size="17" font-weight="700" fill="#0f172a">PokeAPI</text>
<text x="46" y="112" font-size="13.5" fill="#1d4ed8" font-weight="600">Public REST API · JSON over HTTP</text>
<text x="46" y="134" font-size="13.5" fill="#334155">Pokémon names + URLs, paginated (150 rows)</text>
<rect x="30" y="166" width="340" height="94" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="46" y="196" font-size="17" font-weight="700" fill="#0f172a">Supabase</text>
<text x="46" y="220" font-size="13.5" fill="#1d4ed8" font-weight="600">Managed PostgreSQL · relational database</text>
<text x="46" y="242" font-size="13.5" fill="#334155">Songs joined to artists + genres (100 rows)</text>
<rect x="30" y="274" width="340" height="94" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="46" y="304" font-size="17" font-weight="700" fill="#0f172a">MongoDB Atlas</text>
<text x="46" y="328" font-size="13.5" fill="#1d4ed8" font-weight="600">NoSQL document database</text>
<text x="46" y="350" font-size="13.5" fill="#334155">Nested playlist documents (30 docs)</text>
<rect x="30" y="382" width="340" height="94" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="46" y="412" font-size="17" font-weight="700" fill="#0f172a">Amazon S3</text>
<text x="46" y="436" font-size="13.5" fill="#1d4ed8" font-weight="600">Object storage · Parquet file</text>
<text x="46" y="458" font-size="13.5" fill="#334155">Daily song stream counts (200 rows)</text>
<rect x="30" y="490" width="340" height="94" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="46" y="520" font-size="17" font-weight="700" fill="#0f172a">GitHub raw URL</text>
<text x="46" y="544" font-size="13.5" fill="#1d4ed8" font-weight="600">Public CSV file over HTTPS</text>
<text x="46" y="566" font-size="13.5" fill="#334155">S&amp;P 500 company list (503 rows)</text>
<rect x="470" y="58" width="290" height="540" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="615.0" y="84" font-size="13" fill="#047857" text-anchor="middle">DAG: ingest_all_sources</text>
<text x="615.0" y="102" font-size="12" fill="#047857" text-anchor="middle">the same 5 steps run for each source</text>
<text x="615.0" y="126" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">INSIDE AIRFLOW — data stays local</text>
<rect x="495" y="150" width="240" height="54" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
<text x="509" y="173" font-size="14" font-weight="700" fill="#064e3b" font-family="ui-monospace, Menlo, Consolas, monospace">extract</text>
<text x="509" y="192" font-size="12" fill="#047857">pull rows from the source</text>
<rect x="495" y="226" width="240" height="54" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
<text x="509" y="249" font-size="14" font-weight="700" fill="#064e3b" font-family="ui-monospace, Menlo, Consolas, monospace">transform</text>
<text x="509" y="268" font-size="12" fill="#047857">clean names, cast types, add metadata</text>
<rect x="495" y="350" width="240" height="54" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
<text x="509" y="373" font-size="14" font-weight="700" fill="#064e3b" font-family="ui-monospace, Menlo, Consolas, monospace">load_staging</text>
<text x="509" y="392" font-size="12" fill="#047857">upload to stg_&lt;source&gt;</text>
<rect x="495" y="426" width="240" height="54" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
<text x="509" y="449" font-size="14" font-weight="700" fill="#064e3b" font-family="ui-monospace, Menlo, Consolas, monospace">quality_check</text>
<text x="509" y="468" font-size="12" fill="#047857">count rows, check keys</text>
<rect x="495" y="502" width="240" height="54" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
<text x="509" y="525" font-size="14" font-weight="700" fill="#064e3b" font-family="ui-monospace, Menlo, Consolas, monospace">publish</text>
<text x="509" y="544" font-size="12" fill="#047857">copy stg into raw's daily partition</text>
<line x1="615.0" y1="204" x2="615.0" y2="223" stroke="#047857" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="615.0" y="302" font-size="11.5" fill="#64748b" text-anchor="middle">rows saved as local Parquet files</text>
<line x1="484" y1="318" x2="746" y2="318" stroke="#059669" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="615.0" y="334" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">SENDS TO BIGQUERY</text>
<line x1="615.0" y1="404" x2="615.0" y2="423" stroke="#047857" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="615.0" y1="480" x2="615.0" y2="499" stroke="#047857" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M370,105.0 C420,105.0 435,177.0 492,177.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M370,213.0 C420,213.0 435,177.0 492,177.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M370,321.0 C420,321.0 435,177.0 492,177.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M370,429.0 C420,429.0 435,177.0 492,177.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M370,537.0 C420,537.0 435,177.0 492,177.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="426.5" y="58" font-size="11.5" fill="#475569" text-anchor="middle" dy="-0"> </text>
<text x="390" y="163.0" font-size="12" font-weight="700" fill="#475569">extract</text>
<rect x="870" y="58" width="300" height="540" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="1020.0" y="90" font-size="13" fill="#1d4ed8" text-anchor="middle">dataset: ingest_demo</text>
<rect x="888" y="100" width="264" height="132" rx="10" fill="#ffffff" stroke="#93c5fd"/>
<text x="904" y="128" font-size="14" font-weight="700" fill="#1e3a8a" font-family="ui-monospace, Menlo, Consolas, monospace">stg_&lt;source&gt;  ×5</text>
<text x="904" y="148" font-size="12.5" font-weight="600" fill="#1d4ed8">Staging tables</text><text x="904" y="172" font-size="12.5" fill="#334155">Replaced on every run.</text><text x="904" y="190" font-size="12.5" fill="#334155">Checked before anything is published.</text><text x="904" y="208" font-size="12.5" fill="#334155">Auto-expire after 7 days.</text>
<rect x="888" y="244" width="264" height="132" rx="10" fill="#ffffff" stroke="#93c5fd"/>
<text x="904" y="272" font-size="14" font-weight="700" fill="#1e3a8a" font-family="ui-monospace, Menlo, Consolas, monospace">ingestion_audit</text>
<text x="904" y="292" font-size="12.5" font-weight="600" fill="#1d4ed8">Audit table</text><text x="904" y="316" font-size="12.5" fill="#334155">One row per quality check:</text><text x="904" y="334" font-size="12.5" fill="#334155">row counts, null/duplicate keys,</text><text x="904" y="352" font-size="12.5" fill="#334155">pass or fail.</text>
<rect x="888" y="388" width="264" height="132" rx="10" fill="#ffffff" stroke="#93c5fd"/>
<text x="904" y="416" font-size="14" font-weight="700" fill="#1e3a8a" font-family="ui-monospace, Menlo, Consolas, monospace">raw_&lt;source&gt;  ×5</text>
<text x="904" y="436" font-size="12.5" font-weight="600" fill="#1d4ed8">Published tables</text><text x="904" y="460" font-size="12.5" fill="#334155">One partition per load date.</text><text x="904" y="478" font-size="12.5" fill="#334155">Re-running a day overwrites it,</text><text x="904" y="496" font-size="12.5" fill="#334155">so rows are never duplicated.</text>
<path d="M735,377.0 C795,377.0 810,166 884,166" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M735,453.0 C795,453.0 810,310 884,310" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M735,529.0 C795,529.0 810,454 884,454" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>